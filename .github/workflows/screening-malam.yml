name: Screening Malam

on:
  schedule:
    # 18:17 WIB (11:17 UTC), Senin-Jumat — beberapa jam setelah IDX tutup
    # (15:50 WIB). Menit 17 dipilih agar tidak antre di puncak beban cron
    # GitHub (menit 00), yang sering menunda eksekusi.
    - cron: "17 11 * * 1-5"
  workflow_dispatch:
  push:
    # branch default repo saat ini + 'main' untuk jaga-jaga bila kelak di-rename
    branches: [claude/indo-stock-screener-98kizz, main]
    # Trigger push tidak peduli jam, jadi run bisa jatuh di tengah sesi bursa.
    # Itu aman: screener.py membuang bar hari ini selama sesi belum tuntas
    # (lihat bar_terakhir_belum_final) sehingga hasilnya selalu data
    # penutupan, bukan setengah hari perdagangan.

permissions:
  contents: write
  pages: write
  id-token: write
  # Disyaratkan actions/deploy-pages sejak v4: ia mencari artifact lewat ID,
  # dan itu perlu membaca API Actions. Selama ini deploy tetap jalan tanpa
  # baris ini, tapi blok permissions yang eksplisit menyetel semua yang tidak
  # disebut jadi none — jadi kita bergantung pada perilaku yang tidak dijanjikan.
  actions: read

# Satu grup dengan fundamental-kuartalan.yml: keduanya commit dan push ke repo
# yang sama, dan run fundamental berlangsung ~20 menit sehingga tabrakan dengan
# run malam bukan hal teoretis. Antre lebih baik daripada dua push berlomba.
concurrency:
  group: tulis-repo
  cancel-in-progress: false

jobs:
  # Job screening sengaja TIDAK memakai `environment: github-pages`. Environment
  # itu dibatasi ke branch default, dan aturannya diperiksa sebelum job jalan —
  # jadi kalau digabung, run dari branch fitur langsung gagal dalam 2 detik
  # tanpa log. Deploy Pages dipisah ke job `deploy` di bawah.
  screening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependensi
        run: pip install -r requirements.txt

      # Universe pasar disusun ulang tiap run supaya emiten yang naik kelas
      # (atau baru IPO) ikut ter-screening tanpa harus ditambahkan manual.
      # continue-on-error: kalau screener Yahoo sedang rewel, tickers/idx.txt
      # versi commit terakhir tetap dipakai — screening jalan terus.
      - name: Perbarui universe IDX
        continue-on-error: true
        run: python scripts/perbarui_universe.py --min-mcap 1 --maks 400

      # Tanpa --tickers, screener memakai DAFTAR_DEFAULT: daftar kurasi (LQ45,
      # Prajogo, Bakrie, Salim, Hapsoro, Logam) + universe tickers/idx.txt.
      - name: Ambil data & simpan tabel lengkap
        run: python screener.py --output hasil/semua.csv

      # RSI dibatasi 65, bukan 50. Alasannya: --max-rsi dan --min-volspike
      # saling menggerus. Volume yang masuk hari ini justru yang mengangkat
      # RSI, jadi menuntut "harga lagi lemah" (RSI <= 50) sekaligus "volume
      # lagi ramai" (spike >= 1.5) menyisakan irisan yang hampir selalu kosong
      # — bukan cuma saat pasar tertentu. Di data 2 Agu 2026 kombinasi lama
      # meloloskan 0 dari 396 saham.
      #
      # RSI 65 tetap menyaring yang sudah overbought (>= 70 dianggap HOLD oleh
      # hitung_status), tapi membaca "belum kemahalan" alih-alih "harus lagi
      # terkoreksi". Likuiditas diturunkan 10 -> 5 miliar/hari: masih cukup
      # untuk ditransaksikan, tapi tidak membuang mid cap yang layak dilihat.
      # Hasilnya daftar berisi ~5-10 nama untuk dianalisa ulang manual,
      # bukan tabel kosong.
      - name: Screening swing (uptrend, belum overbought, volume masuk)
        run: >
          python screener.py --dari-csv hasil/semua.csv
          --max-rsi 65 --di-atas-ma200 --min-volspike 1.2 --min-nilai 5
          --output hasil/swing.csv

      # Ambang "medium risk": PBV 3,5 supaya blue chip berkualitas yang selalu
      # dihargai premium (BBCA, SIDO) tidak otomatis tersaring keluar.
      - name: Screening value (PER <= 15, PBV <= 3.5, ROE >= 15%)
        run: >
          python screener.py --dari-csv hasil/semua.csv
          --max-per 15 --max-pbv 3.5 --min-roe 15
          --output hasil/value.csv

      # "Lapkeu bagus": laba kuartal terakhir tumbuh YoY, ROE layak, valuasi
      # belum kelewat mahal, dan masih bisa ditransaksikan. Sengaja tanpa
      # syarat teknikal — ini saringan fundamental, bukan timing.
      - name: Screening tumbuh (laba naik YoY, valuasi wajar)
        run: >
          python screener.py --dari-csv hasil/semua.csv
          --min-laba-yoy 20 --min-roe 10 --max-per 25 --min-nilai 1
          --output hasil/tumbuh.csv

      # Struktur harga untuk kandidat swing: zona entri, invalidasi, target.
      # Screening menjawab "saham apa", langkah ini "masuk di harga berapa".
      # Sengaja hanya atas swing.csv (~5-10 nama): value.csv dan tumbuh.csv
      # adalah saringan fundamental tanpa syarat teknikal, jadi isinya banyak
      # yang strukturnya sedang jelek dan hasilnya cuma deretan "HINDARI".
      #
      # continue-on-error: langkah ini menarik data intraday, jalur Yahoo yang
      # berbeda dari harga harian yang dipakai screener. Kalau jalur itu sedang
      # rewel, seluruh tabel fundamental yang sudah jadi tidak boleh ikut hangus
      # — dashboard menangani hasil/swing_smc.csv yang hilang dengan tab kosong,
      # bukan dengan gagal memuat.
      - name: Analisa struktur SMC untuk kandidat swing
        continue-on-error: true
        run: python analisa_smc.py --dari-csv hasil/swing.csv --output hasil/swing_smc.csv

      - name: Catat waktu pembaruan
        run: |
          printf '{"diperbarui": "%s"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > hasil/meta.json

      - name: Commit hasil
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # tickers/idx.txt ikut di-commit: universe yang dipakai run malam ini
          # harus ikut tercatat, dan jadi cadangan bila pembaruan berikutnya gagal.
          git add hasil/ tickers/idx.txt
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan data, tidak ada yang di-commit."
            exit 0
          fi
          git commit -m "Hasil screening $(TZ=Asia/Jakarta date '+%Y-%m-%d %H:%M WIB')"

          # Push dicoba beberapa kali, dan pull --rebase hanya dijalankan
          # ketika push benar-benar ditolak. Urutan lama (rebase dulu, lalu
          # push sekali) tidak menutup celah balapan sama sekali: apa pun yang
          # masuk ke remote di antara kedua perintah itu membuat push gagal
          # dan seluruh langkah ini mati.
          #
          # Run terjadwal 10 Agu 2026 gagal di langkah ini dengan exit code 1
          # meski commit-nya terbukti sampai ke remote. Penyebab pastinya tidak
          # bisa dipastikan tanpa log, jadi ini penanggulangan untuk kelasnya —
          # bukan perbaikan atas sebab yang sudah terdiagnosis. Kalaupun gagal
          # lagi, keluarannya kini menyebut percobaan keberapa dan apa yang
          # ditolak, sehingga bisa ditelusuri dari ringkasan run.
          for percobaan in 1 2 3; do
            if git push; then
              echo "Berhasil didorong pada percobaan ke-$percobaan."
              exit 0
            fi
            echo "Push ditolak pada percobaan ke-$percobaan — menarik ulang lalu mencoba lagi."
            git pull --rebase origin "$GITHUB_REF_NAME" || {
              echo "Rebase gagal; kemungkinan ada konflik yang tidak bisa diselesaikan otomatis." >&2
              exit 1
            }
          done
          echo "Push tetap gagal setelah 3 percobaan." >&2
          exit 1

      - name: Susun situs dashboard
        run: |
          mkdir -p _site
          cp dashboard/index.html _site/
          cp -r hasil _site/

      - name: Aktifkan & konfigurasi GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  # Deploy hanya dari branch default: environment github-pages menolak branch
  # lain. Run dari branch fitur tetap menghasilkan CSV di folder hasil/ —
  # hanya langkah publikasi dashboard yang dilewati.
  deploy:
    needs: screening
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy ke GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
