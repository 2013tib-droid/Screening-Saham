name: Cek Volume IHSG (sementara)

# SEMENTARA: memeriksa apakah volume ^JKSE dari Yahoo terisi dan masuk akal
# sebelum dipakai untuk distribution day / follow-through day. Dihapus
# sebelum merge.
on:
  push:
    branches: [claude/position-sizer-distribution-ftd-k65qqg]
    paths: [.github/workflows/cek-volume-ihsg.yml, scripts/cek_volume_ihsg.py]

permissions:
  contents: read

jobs:
  cek:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/cek_volume_ihsg.py
